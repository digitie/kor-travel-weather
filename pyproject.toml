[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kor-travel-weather"
version = "0.1.0.dev0"
description = "Independent Korean weather data source with KMA, Dagster, REST API and admin UI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "digitie" }]
keywords = ["weather", "korea", "kma", "dagster", "fastapi", "data-source"]
dependencies = [
  "kor-travel-common[reverse-address] @ git+https://github.com/digitie/kor-travel-common.git@aefdc8695aecc09fd73c97c083b00e6379681c07#subdirectory=packages/py/kor-travel-common",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "sqlalchemy==2.1.9",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.9",
  "anyio>=4,<5",
  "fastapi==0.165.0",
  "httpx==0.28.1",
  "uvicorn[standard]==0.54.0",
  "cryptography>=42",
  "prometheus-client>=0.20,<1",
  "python-kma-api @ git+https://github.com/digitie/python-kma-api.git@8d5e65d021a8352ee71341c76a996fd96ab97005",
  "python-airkorea-api",
  "python-khoa-api @ git+https://github.com/digitie/python-khoa-api.git@9c952bb8613472ccd4e532d1267680ab23d66dbd",
  "python-krforest-api @ git+https://github.com/digitie/python-krforest-api.git@70814c9f21532b931151a0a667cb94a2afa13dd8",
  "python-krex-api @ git+https://github.com/digitie/python-krex-api.git@6646be516bcb5f2f206044186066baae2f5b63c6",
  "pyproj>=3.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx==0.28.1",
  "ruff>=0.9",
  "mypy>=1.13",
  # tests/test_deployment_contract.py parses the compose files; do not rely on
  # this arriving transitively through a server dependency.
  "pyyaml>=6",
]
# Exact, not floors. These processes are the *user code* side of a Dagster
# deployment, and Dagster only supports a host (webserver/daemon) whose version
# is >= every code server it serves. Once several projects share one host, a
# floor here would let the next rebuild resolve a newer dagster than the host
# and silently leave that support window; the lock alone cannot stop a
# ``uv lock --upgrade`` from doing that. Moving this line is a deliberate
# version bump done together with the shared host, never a side effect.
# dagster-graphql/-pipes/-shared follow from dagster's own ``==`` requirements.
dagster = [
  "kor-travel-common[grpc-health,reverse-address] @ git+https://github.com/digitie/kor-travel-common.git@aefdc8695aecc09fd73c97c083b00e6379681c07#subdirectory=packages/py/kor-travel-common",
  "dagster==1.13.24",
  "dagster-webserver==1.13.24",
  "croniter>=6,<7",
  # Backs run/event-log/schedule storage with PostgreSQL instead of Dagster's
  # SQLite default; see deploy/dagster.yaml for why. dagster-postgres does not
  # share dagster's own version numbering (dagster 1.13.N ships with
  # dagster-postgres 0.29.N), so it is pinned to its own matching release.
  "dagster-postgres==0.29.24",
]

[project.scripts]
ktwctl = "kortravelweather.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["kortravelweather*"]

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "packages/kor-travel-weather-api/tests",
  "packages/kor-travel-weather-dagster/tests",
]
pythonpath = [
  "src",
  "tests",
  "packages/kor-travel-weather-api/src",
  "packages/kor-travel-weather-dagster/src",
  # tests/test_export_daily_sources.py가 API 시험의 fixture 모듈(test_all_source_exports)을 쓴다.
  # 전체 실행에서는 그 디렉터리가 수집될 때 경로에 올라 우연히 됐다. 파일 단위 실행에서도 되게 명시한다.
  "packages/kor-travel-weather-api/tests",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RET", "SIM"]

[tool.uv.sources]
python-airkorea-api = { path = "packages/python-airkorea-api" }

[tool.mypy]
python_version = "3.11"
strict = true

[tool.setuptools.package-data]
kortravelweather = ["reference/*.json"]
