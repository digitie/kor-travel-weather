[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kor-travel-weather"
version = "0.1.0.dev0"
description = "Independent Korean weather data source with KMA, Dagster, REST API and admin UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "digitie" }]
keywords = ["weather", "korea", "kma", "dagster", "fastapi", "data-source"]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "fastapi>=0.115",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30",
  "cryptography>=42",
  "python-kma-api @ git+https://github.com/digitie/python-kma-api.git@0868b76bd4b7de96b20f667e431c3f43b67cb537",
  "python-airkorea-api",
  "pyproj>=3.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27,<1",
  "ruff>=0.9",
  "mypy>=1.13",
]
dagster = [
  "dagster>=1.9,<2",
  "dagster-webserver>=1.9,<2",
]

[project.scripts]
ktwctl = "kortravelweather.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["kortravelweather*"]

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "packages/kor-travel-weather-api/tests",
  "packages/kor-travel-weather-dagster/tests",
]
pythonpath = [
  "src",
  "packages/kor-travel-weather-api/src",
  "packages/kor-travel-weather-dagster/src",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RET", "SIM"]

[tool.uv.sources]
python-airkorea-api = { path = "packages/python-airkorea-api" }

[tool.mypy]
python_version = "3.11"
strict = true
