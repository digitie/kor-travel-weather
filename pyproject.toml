[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kor-travel-weather"
version = "0.1.0.dev0"
description = "Independent Korean weather data source with KMA, Dagster, REST API and admin UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "digitie" }]
keywords = ["weather", "korea", "kma", "dagster", "fastapi", "data-source"]
dependencies = [
  "kor-travel-common @ git+https://github.com/digitie/kor-travel-common.git@270619bd98c21ead62d077bf46f09c92dd946a59#subdirectory=packages/py/kor-travel-common",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "fastapi>=0.115",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30",
  "cryptography>=42",
  "prometheus-client>=0.20,<1",
  "python-kma-api @ git+https://github.com/digitie/python-kma-api.git@4ac9a32579e183734e2fa66f389c3cff054e8025",
  "python-airkorea-api",
  "python-khoa-api @ git+https://github.com/digitie/python-khoa-api.git@38a2b74aabc1c077ebd2e1aa5ad3b2a70ffc8dd5",
  "python-krforest-api @ git+https://github.com/digitie/python-krforest-api.git@270ef7a9884bef1f995e2f8fb43c5fb1e9da7905",
  "python-krex-api @ git+https://github.com/digitie/python-krex-api.git@d153f3cdd87c9cfacceeb94310bbe6067a1bbfa8",
  "pyproj>=3.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27,<1",
  "ruff>=0.9",
  "mypy>=1.13",
  # tests/test_deployment_contract.py parses the compose files; do not rely on
  # this arriving transitively through a server dependency.
  "pyyaml>=6",
]
# Exact, not floors. These processes are the *user code* side of a Dagster
# deployment, and Dagster only supports a host (webserver/daemon) whose version
# is >= every code server it serves. Once several projects share one host, a
# floor here would let the next rebuild resolve a newer dagster than the host
# and silently leave that support window; the lock alone cannot stop a
# ``uv lock --upgrade`` from doing that. Moving this line is a deliberate
# version bump done together with the shared host, never a side effect.
# dagster-graphql/-pipes/-shared follow from dagster's own ``==`` requirements.
dagster = [
  "dagster==1.13.24",
  "dagster-webserver==1.13.24",
  # Backs run/event-log/schedule storage with PostgreSQL instead of Dagster's
  # SQLite default; see deploy/dagster.yaml for why. dagster-postgres does not
  # share dagster's own version numbering (dagster 1.13.N ships with
  # dagster-postgres 0.29.N), so it is pinned to its own matching release.
  "dagster-postgres==0.29.24",
]

[project.scripts]
ktwctl = "kortravelweather.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["kortravelweather*"]

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "packages/kor-travel-weather-api/tests",
  "packages/kor-travel-weather-dagster/tests",
]
pythonpath = [
  "src",
  "packages/kor-travel-weather-api/src",
  "packages/kor-travel-weather-dagster/src",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RET", "SIM"]

[tool.uv.sources]
python-airkorea-api = { path = "packages/python-airkorea-api" }

[tool.mypy]
python_version = "3.11"
strict = true
