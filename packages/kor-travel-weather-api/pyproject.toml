[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kor-travel-weather-api"
version = "0.1.0.dev0"
description = "FastAPI REST surface for the kor-travel-weather source."
requires-python = ">=3.12"
dependencies = [
  "kor-travel-weather",
  "anyio>=4,<5",
  "fastapi==0.165.0",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest>=8", "pytest-asyncio>=0.23"]

[tool.uv.sources]
kor-travel-weather = { path = "../..", editable = true }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
