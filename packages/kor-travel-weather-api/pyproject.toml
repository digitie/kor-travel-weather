[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kor-travel-weather-api"
version = "0.1.0.dev0"
description = "FastAPI REST surface for the kor-travel-weather source."
requires-python = ">=3.11"
dependencies = [
  "kor-travel-weather",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8", "pytest-asyncio>=0.23"]

[tool.uv.sources]
kor-travel-weather = { path = "../..", editable = true }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
