[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-airkorea-api"
version = "0.4.0"
description = "Python client for Korea Environment Corporation AirKorea public APIs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "digitie" }
]
keywords = ["airkorea", "keco", "fine-dust", "air-quality", "data.go.kr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7",
  "pyproj>=3.5",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.5",
]
debug-ui = [
  "pandas>=2",
  "streamlit>=1.36",
]

[project.scripts]
airkorea = "airkorea.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["airkorea*"]

[tool.setuptools.package-data]
airkorea = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -s -m 'not integration'"
pythonpath = ["src"]
markers = [
  "integration: tests that call the real AirKorea API and require DATA_GO_KR_SERVICE_KEY",
]
