groups:
  - name: kor-travel-weather
    rules:
      - alert: KorTravelWeatherScrapeDown
        expr: up{job=~"kor-travel-weather-(api|dagster)"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Weather metrics scrape target is down"
          description: "{{ $labels.job }} has not been scraped successfully for 5 minutes."

      - alert: KorTravelWeatherApiErrors
        expr: |
          sum(rate(ktw_http_requests_total{status_class="5xx"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Weather API is returning server errors"
          description: "5xx responses have been observed for at least 10 minutes."

      - alert: KorTravelWeatherProviderErrors
        expr: |
          sum(rate(ktw_provider_requests_total{outcome="error"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Weather provider requests are failing"
          description: "At least one provider request has failed for 10 minutes."

      - alert: KorTravelWeatherForwardPartitionsLow
        expr: |
          max(ktw_forward_partition_days{job="kor-travel-weather-api"}) <= 3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "weather_values has 3 or fewer days of forward partitions"
          description: "The nightly retention job extends the window. Facts dated past the last partition are refused once DEFAULT has a floor; check weather_retention_job."

      - alert: KorTravelWeatherForwardPartitionsUnknown
        expr: |
          absent(ktw_forward_partition_days{job="kor-travel-weather-api"})
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The API has not reported the weather_values forward partition window"
          description: "The API omits ktw_forward_partition_days when its catalog read fails (see ktw_metrics_errors_total{operation=\"forward_partitions\"}), which would silence KorTravelWeatherForwardPartitionsLow."

      - alert: KorTravelWeatherSyncFailed
        expr: |
          sum(increase(ktw_sync_runs_finished_total{status=~"failed|partial"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A weather sync run failed or was partial"
          description: "Inspect the sync-run catalog and provider coverage before the next hourly run."

      # A run finishes partial (KorTravelWeatherSyncFailed) on any invalid
      # value, so this rule adds the dataset name rather than a new page.  It
      # reads every reason but missing, as the run does (`other` is invalid).
      # The series is created by its first increment, which increase() reads
      # as 0, so the `unless ... offset 1h` branch catches a series that did
      # not exist an hour ago.  It can also fire once if the Dagster target
      # was unscraped an hour ago (KorTravelWeatherScrapeDown covers that).
      - alert: KorTravelWeatherValuesInvalid
        expr: |
          sum by (provider, dataset) (
            increase(ktw_sync_values_skipped_total{reason!="missing"}[1h])
          ) > 0
          or
          sum by (provider, dataset) (
            ktw_sync_values_skipped_total{reason!="missing"}
            unless ktw_sync_values_skipped_total{reason!="missing"} offset 1h
          )
        labels:
          severity: warning
        annotations:
          summary: "KMA returned out-of-range or non-finite values"
          description: "{{ $labels.provider }}/{{ $labels.dataset }} dropped values that are neither valid nor a Missing sentinel in the last hour. The run finishes partial; this names the dataset. Check the provider response contract."

      # Missing sentinels only make a run partial past ~10% of its values
      # (~137 of ~1,368 per hourly nowcast run, 17-34 offline stations), so a
      # smaller outage stays success and silent.  One offline station drops 7
      # of its 8 categories per run: 21 per 3h window (3 hourly runs), 42 for
      # two stations, still 56 if a catch-up run lands in the window.  Above
      # 60 means a third station, held for an hour (so a blip that clears in
      # a run does not page).  The review's 15-station outage (105 per run)
      # crosses 60 on its first run and pages an hour later.  The first run
      # after a Dagster restart is not counted (new series, see above); a
      # sustained outage is caught from its second run.
      - alert: KorTravelWeatherValuesMissingHigh
        expr: |
          sum by (provider, dataset) (
            increase(ktw_sync_values_skipped_total{reason="missing"}[3h])
          ) > 60
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "KMA values are missing beyond one routine station outage"
          description: "{{ $labels.provider }}/{{ $labels.dataset }} dropped more than 60 Missing-sentinel values over 3h for an hour (one offline station drops about 21). Runs stay success until ~10% of a run is missing; check which stations or grids are blank."
