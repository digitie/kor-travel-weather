groups:
  - name: kor-travel-weather
    rules:
      - alert: KorTravelWeatherScrapeDown
        expr: up{job=~"kor-travel-weather-(api|dagster)"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Weather metrics scrape target is down"
          description: "{{ $labels.job }} has not been scraped successfully for 5 minutes."

      - alert: KorTravelWeatherApiErrors
        expr: |
          sum(rate(ktw_http_requests_total{status_class="5xx"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Weather API is returning server errors"
          description: "5xx responses have been observed for at least 10 minutes."

      - alert: KorTravelWeatherProviderErrors
        expr: |
          sum(rate(ktw_provider_requests_total{outcome="error"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Weather provider requests are failing"
          description: "At least one provider request has failed for 10 minutes."

      # A provider's edge refusing requests (a WAF page, not an API error).
      # The collector skips that source instead of failing its run, so this is
      # the signal that the block is there.  Only python-krex-api classifies
      # blocks today (twice daily, 08:30Z/20:30Z); 13h holds one run plus 1h
      # of slack, so a lasting block keeps firing and the first unblocked run
      # resolves it about an hour later.  Counter difference rather than
      # increase(), for the reasons given at KorTravelWeatherValuesInvalid below;
      # the blocked child starts at 0 (kortravelweather_dagster.regional_sources
      # creates it on import).  Costs: for 13h after a Dagster restart or a
      # new scrape target, nothing a window ago, so silent.
      - alert: KorTravelWeatherProviderBlocked
        expr: |
          sum by (provider, dataset) (
            max_over_time(ktw_provider_requests_total{outcome="blocked"}[10m])
            - max_over_time(ktw_provider_requests_total{outcome="blocked"}[10m] offset 13h)
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: "A weather provider is refusing requests at its edge"
          description: "{{ $labels.provider }}/{{ $labels.dataset }} answered with a block page (not an API error) within the last 13h. The collector skips that source and the rest of its job still publishes; nothing is collected from it until the block lifts. The step metadata carries failure_kind=upstream_blocked."

      - alert: KorTravelWeatherForwardPartitionsLow
        expr: |
          max(ktw_forward_partition_days{job="kor-travel-weather-api"}) <= 3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "weather_values has 3 or fewer days of forward partitions"
          description: "The nightly retention job extends the window. Facts dated past the last partition are refused once DEFAULT has a floor; check weather_retention_job."

      - alert: KorTravelWeatherForwardPartitionsUnknown
        expr: |
          absent(ktw_forward_partition_days{job="kor-travel-weather-api"})
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The API has not reported the weather_values forward partition window"
          description: "The API omits ktw_forward_partition_days (and ktw_oldest_partition_age_days, read from the same catalog) when its catalog read fails (see ktw_metrics_errors_total{operation=\"forward_partitions\"}), which would silence KorTravelWeatherForwardPartitionsLow and KorTravelWeatherRetentionStale."

      # Retention staleness.  The oldest dated partition is RETENTION_DAYS (16
      # in production) old right after the nightly drop and 17 just before
      # the next one; each night without a drop adds one.  Over 18 is the
      # second night in a row.  The API computes the sample but does not carry
      # RETENTION_DAYS (only the code-server does), so 16 + 2 lives here;
      # tests/test_metrics.py pins it.  A retention run that defers a day
      # (lost lock races) is still green; this is what notices the deferrals
      # piling up.  Forward-window failures are ForwardPartitionsLow's.
      - alert: KorTravelWeatherRetentionStale
        expr: |
          max(ktw_oldest_partition_age_days{job="kor-travel-weather-api"}) > 18
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "weather_values retention has not dropped a day for two nights"
          description: "The oldest dated weather_values partition is {{ $value }} days old; RETENTION_DAYS is 16 and the nightly weather_retention_job keeps it at 16-17. Check that job's runs: deferred or overdue partitions are listed in its metadata."

      - alert: KorTravelWeatherSyncFailed
        expr: |
          sum(increase(ktw_sync_runs_finished_total{status=~"failed|partial"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A weather sync run failed or was partial"
          description: "Inspect the sync-run catalog and provider coverage before the next hourly run."

      # Both skip-value rules take the counter minus its value a window ago,
      # not increase().  The Dagster sum is merged from per-worker mmap files,
      # and a file skipped for one scrape (malformed while a live worker
      # writes it) or removed (a dead worker's malformed file) makes the sum
      # dip; increase() reads a dip as a counter reset and counts the whole
      # counter as new.  A plain difference reads it as a drop and stays
      # quiet.  The children start at 0 (kortravelweather_dagster.kma_weather
      # creates them on import), so the first skip has a value to subtract.
      # Each side is max_over_time over 10m, so a single stale scrape or a
      # one-scrape dip on either side (now, or a window ago) changes nothing:
      # a firing alert does not resolve and `for` does not restart.  A gap
      # longer than 10m returns nothing rather than firing.
      # Costs, each for one window (1h invalid, 3h30m missing):
      # - after a Dagster restart the tmpfs counters start again at 0, the
      #   difference is negative, and skips are not seen;
      # - a lasting drop of D (a dead worker's file removed) hides a rise of
      #   up to D;
      # - a changed scrape target or instance label starts new series with
      #   nothing a window ago, so both rules are silent.

      # A run finishes partial (KorTravelWeatherSyncFailed) on any invalid
      # value, so this rule adds the dataset name rather than a new page.  It
      # reads every reason but missing, as the run does (`other` is invalid).
      - alert: KorTravelWeatherValuesInvalid
        expr: |
          sum by (provider, dataset) (
            max_over_time(ktw_sync_values_skipped_total{reason!="missing"}[10m])
            - max_over_time(ktw_sync_values_skipped_total{reason!="missing"}[10m] offset 1h)
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: "KMA returned out-of-range or non-finite values"
          description: "{{ $labels.provider }}/{{ $labels.dataset }} dropped values that are neither valid nor a Missing sentinel in the last hour. The run finishes partial; this names the dataset. Check the provider response contract."

      # Missing sentinels only make a run partial past ~10% of its values, so
      # a smaller outage stays success and silent.  The threshold is sized
      # for the hourly nowcast (~1,368 values per run, partial past ~137, i.e.
      # 17-34 offline stations): one offline station drops 7 of its 8
      # categories per run, and the 3h30m window holds 3 or 4 runs, so one
      # station is 21-28 (35 with a catch-up run) and two are 42-56.  Above
      # 60 means a third station (63-84).  The review's 15-station outage
      # (105 per run) crosses 60 on its first run.  The forecasts share the
      # rule: per run they attempt far more values, so 60 is a small share
      # there and means a forecast column is blank.
      # `for: 1h` delays the page by an hour; it does not demand a sustained
      # outage, since one run stays in the window for 3h30m.
      # Not 3h: runs finish at varying times after the hour, so four runs can
      # span more than 3h and a 3h window then holds only two for a few
      # minutes; one such evaluation resets `for`.  3h30m tolerates 30m.
      - alert: KorTravelWeatherValuesMissingHigh
        expr: |
          sum by (provider, dataset) (
            max_over_time(ktw_sync_values_skipped_total{reason="missing"}[10m])
            - max_over_time(ktw_sync_values_skipped_total{reason="missing"}[10m] offset 3h30m)
          ) > 60
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "KMA values are missing beyond one routine station outage"
          description: "{{ $labels.provider }}/{{ $labels.dataset }} dropped more than 60 Missing-sentinel values over the last 3h30m, for an hour. For the hourly nowcast that is a third offline station (one drops 21-28); runs stay success until ~10% of a run is missing. Check which stations or grids are blank."
