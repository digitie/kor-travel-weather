# Dagster instance settings for the compose deployment.
#
# Without this file Dagster runs on its defaults, and one of those defaults has
# taken ingestion down twice: a run whose process disappears stays STARTED for
# ever. It keeps counting against `max_concurrent_runs`, so after enough
# container replacements the limit is full of runs that are not running and the
# daemon logs "10 runs are currently in progress. Maximum is 10, won't launch
# more" until somebody notices. The second time, hourly collection had been
# stalled for eighteen hours.
#
# `run_monitoring` is the supported cure: the daemon checks that a started run
# still has a live process and fails it when it does not, which releases the
# slot on its own.
#
# Storage below is what run_monitoring's own bookkeeping depends on. Without
# it, Dagster falls back to SQLite files under DAGSTER_HOME, and SQLite
# accepts one writer at a time -- ten concurrent runs plus the daemon are ten
# writers. Under load that surfaced as `sqlite3.OperationalError: database is
# locked`, and a run whose STEP_SUCCESS/RUN_SUCCESS event lost that race never
# updates its own status: it stays STARTED with a live process run_monitoring
# has no reason to touch, and the run coordinator counts it against
# `max_concurrent_runs` forever. PostgreSQL is the officially supported
# alternative and handles concurrent writers correctly. It lives in its own
# database (`weather_dagster`, see deploy/n150.md) rather than a schema inside
# the application's own database, because dagster-postgres manages its schema
# with its own Alembic history under a table literally named
# `alembic_version` -- sharing a database with this project's own
# `alembic_version` would collide.
run_storage:
  module: dagster_postgres.run_storage
  class: PostgresRunStorage
  config:
    postgres_url:
      env: DAGSTER_POSTGRES_URL

event_log_storage:
  module: dagster_postgres.event_log
  class: PostgresEventLogStorage
  config:
    postgres_url:
      env: DAGSTER_POSTGRES_URL

schedule_storage:
  module: dagster_postgres.schedule_storage
  class: PostgresScheduleStorage
  config:
    postgres_url:
      env: DAGSTER_POSTGRES_URL

run_monitoring:
  enabled: true
  # A deploy replaces the container, so a run can look unresponsive while it is
  # simply being restarted. Long enough not to fail healthy runs mid-deploy,
  # short enough that a stalled schedule is noticed within one interval.
  start_timeout_seconds: 300
  max_resume_run_attempts: 0
  poll_interval_seconds: 60
  # The liveness check above only fails a run whose *process is gone*. A process
  # that is alive and wedged inside one socket read is indistinguishable from one
  # doing useful work, so nothing above can end it. That is not hypothetical: ten
  # runs sat STARTED for between three and eighteen hours, filled
  # `max_concurrent_runs` with work that was not running, and every schedule
  # behind them -- KMA, AirKorea, regional -- stopped launching entirely while
  # the daemon logged "Maximum is 10, won't launch more" for most of a day.
  #
  # This is the only bound that does not care *why* a run stopped moving: it
  # compares wall clock against the run's start time and cancels past it.
  #
  # Sized from measured production runs, not from what the cadence implies. Over
  # one week, runs that *succeeded* took 23,898s for weatherapi_forecast and
  # 22,959s for weatherapi_current -- and one job now covers every dataset of its
  # provider, so weatherapi alone is ~13h of legitimate work. A cap anywhere near
  # the hourly schedule would cancel healthy runs and turn this backstop into the
  # outage it is meant to prevent, so it sits above the worst measured case.
  #
  # This value is deliberately uncomfortable. A 1-hour schedule whose run takes
  # 13 hours is the reason the queue fills in the first place, and no timeout
  # fixes that -- only collecting less, or collecting less often, does. Bring
  # this down once a sweep fits inside its own interval.
  max_runtime_seconds: 57600

run_coordinator:
  module: dagster._core.run_coordinator
  class: QueuedRunCoordinator
  config:
    # The ingest jobs are IO-bound against rate-limited public APIs, so the cap
    # exists to protect the providers and this host's single spinning disk, not
    # the CPU. Raising it does not make collection faster.
    max_concurrent_runs: 10
    # External collection is one job per provider (see definitions.py), and a
    # full sweep of one provider currently runs for hours against rate-limited
    # free tiers while its schedule fires every hour. Uncapped, those nine jobs
    # take every slot and hold it: that is exactly how KMA, AirKorea and the
    # regional sources ended up queued behind work that was not going to finish
    # this hour either. Reserving the rest of the pool for them matters more
    # than collecting every external provider on every tick.
    tag_concurrency_limits:
      - key: "kortravelweather/run_group"
        value: "external_weather"
        limit: 3

retention:
  # Run history is the only record of what collection did, but it is also the
  # thing that grows without bound on a host that has already run out of disk
  # once. A fortnight outlives any weekend.
  schedule:
    purge_after_days: 14
  sensor:
    purge_after_days: 14
