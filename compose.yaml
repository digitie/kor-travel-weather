services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weather}
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Bind service ports to loopback; expose them through an authenticated
    # gateway/SSH tunnel rather than publishing the database directly.
    ports:
      - "127.0.0.1:14100:5432"
    volumes:
      - weather-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
      args:
        INSTALL_DAGSTER: "0"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Compose is the supported PostgreSQL deployment surface.  Local runs
      # should use the PostgreSQL service (or another PostgreSQL DSN).
      KOR_TRAVEL_WEATHER_ENV: production
      # Pass the password through libpq rather than interpolating it in a URL;
      # punctuation such as @ and : therefore remains safe.
      KOR_TRAVEL_WEATHER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-weather}@db:5432/${POSTGRES_DB:-weather}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      KOR_TRAVEL_WEATHER_ADMIN_TOKEN: ${KOR_TRAVEL_WEATHER_ADMIN_TOKEN:?set KOR_TRAVEL_WEATHER_ADMIN_TOKEN in .env}
      KOR_TRAVEL_WEATHER_CREDENTIAL_ENCRYPTION_KEY: ${KOR_TRAVEL_WEATHER_CREDENTIAL_ENCRYPTION_KEY:-}
      KOR_TRAVEL_WEATHER_CORS_ORIGINS: '${KOR_TRAVEL_WEATHER_CORS_ORIGINS:-["https://weather.digitie.mywire.org","http://127.0.0.1:14105"]}'
      KOR_TRAVEL_WEATHER_API_BASE_URL: ${KOR_TRAVEL_WEATHER_API_BASE_URL:-https://weather-api.digitie.mywire.org}
      KOR_TRAVEL_WEATHER_GIT_COMMIT: ${KOR_TRAVEL_WEATHER_GIT_COMMIT:-container}
      KOR_TRAVEL_WEATHER_DATA_GO_KR_SERVICE_KEY: ${KOR_TRAVEL_WEATHER_DATA_GO_KR_SERVICE_KEY:-}
      KOR_TRAVEL_WEATHER_AIRKOREA_API_KEY: ${KOR_TRAVEL_WEATHER_AIRKOREA_API_KEY:-${KOR_TRAVEL_WEATHER_DATA_GO_KR_SERVICE_KEY:-}}
      KOR_TRAVEL_WEATHER_KMA_ALERT_STATION_ID: ${KOR_TRAVEL_WEATHER_KMA_ALERT_STATION_ID:-108}
      KOR_TRAVEL_WEATHER_ENABLED_PROVIDERS: ${KOR_TRAVEL_WEATHER_ENABLED_PROVIDERS:-["python-kma-api","python-airkorea-api","open_meteo","weatherapi","openweathermap","visual_crossing","tomorrow_io","weatherbit","weatherstack","accuweather","wttr_in"]}
      KOR_TRAVEL_WEATHER_WEATHERAPI_API_KEY: ${KOR_TRAVEL_WEATHER_WEATHERAPI_API_KEY:-}
      KOR_TRAVEL_WEATHER_OPENWEATHERMAP_API_KEY: ${KOR_TRAVEL_WEATHER_OPENWEATHERMAP_API_KEY:-}
      KOR_TRAVEL_WEATHER_VISUAL_CROSSING_API_KEY: ${KOR_TRAVEL_WEATHER_VISUAL_CROSSING_API_KEY:-}
      KOR_TRAVEL_WEATHER_TOMORROW_IO_API_KEY: ${KOR_TRAVEL_WEATHER_TOMORROW_IO_API_KEY:-}
      KOR_TRAVEL_WEATHER_WEATHERBIT_API_KEY: ${KOR_TRAVEL_WEATHER_WEATHERBIT_API_KEY:-}
      KOR_TRAVEL_WEATHER_WEATHERSTACK_API_KEY: ${KOR_TRAVEL_WEATHER_WEATHERSTACK_API_KEY:-}
      KOR_TRAVEL_WEATHER_ACCUWEATHER_API_KEY: ${KOR_TRAVEL_WEATHER_ACCUWEATHER_API_KEY:-}
      KOR_TRAVEL_WEATHER_OPEN_METEO_BASE_URL: ${KOR_TRAVEL_WEATHER_OPEN_METEO_BASE_URL:-https://api.open-meteo.com/v1}
      KOR_TRAVEL_WEATHER_WTTR_IN_BASE_URL: ${KOR_TRAVEL_WEATHER_WTTR_IN_BASE_URL:-https://wttr.in}
      KOR_TRAVEL_WEATHER_VISUAL_CROSSING_BASE_URL: ${KOR_TRAVEL_WEATHER_VISUAL_CROSSING_BASE_URL:-https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services}
      KOR_TRAVEL_WEATHER_MAX_PAYLOAD_BYTES_PER_RUN: ${KOR_TRAVEL_WEATHER_MAX_PAYLOAD_BYTES_PER_RUN:-16777216}
    ports:
      - "127.0.0.1:14101:14101"
    command: ["uvicorn", "kortravelweather_api.app:app", "--host", "0.0.0.0", "--port", "14101"]
    working_dir: /app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:14101/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  dagster:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
      args:
        INSTALL_DAGSTER: "1"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DAGSTER_HOME: /opt/dagster/home
      KOR_TRAVEL_WEATHER_ENV: production
      KOR_TRAVEL_WEATHER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-weather}@db:5432/${POSTGRES_DB:-weather}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      KOR_TRAVEL_WEATHER_ADMIN_TOKEN: ${KOR_TRAVEL_WEATHER_ADMIN_TOKEN:?set KOR_TRAVEL_WEATHER_ADMIN_TOKEN in .env}
      KOR_TRAVEL_WEATHER_CREDENTIAL_ENCRYPTION_KEY: ${KOR_TRAVEL_WEATHER_CREDENTIAL_ENCRYPTION_KEY:-}
      KOR_TRAVEL_WEATHER_DATA_GO_KR_SERVICE_KEY: ${KOR_TRAVEL_WEATHER_DATA_GO_KR_SERVICE_KEY:-}
      KOR_TRAVEL_WEATHER_AIRKOREA_API_KEY: ${KOR_TRAVEL_WEATHER_AIRKOREA_API_KEY:-${KOR_TRAVEL_WEATHER_DATA_GO_KR_SERVICE_KEY:-}}
      KOR_TRAVEL_WEATHER_KMA_ALERT_STATION_ID: ${KOR_TRAVEL_WEATHER_KMA_ALERT_STATION_ID:-108}
      KOR_TRAVEL_WEATHER_ENABLED_PROVIDERS: ${KOR_TRAVEL_WEATHER_ENABLED_PROVIDERS:-["python-kma-api","python-airkorea-api","open_meteo","weatherapi","openweathermap","visual_crossing","tomorrow_io","weatherbit","weatherstack","accuweather","wttr_in"]}
      KOR_TRAVEL_WEATHER_PROVIDER_HTTP_TIMEOUT_SECONDS: ${KOR_TRAVEL_WEATHER_PROVIDER_HTTP_TIMEOUT_SECONDS:-15}
      KOR_TRAVEL_WEATHER_PROVIDER_RETRIES: ${KOR_TRAVEL_WEATHER_PROVIDER_RETRIES:-1}
      KOR_TRAVEL_WEATHER_WEATHERAPI_API_KEY: ${KOR_TRAVEL_WEATHER_WEATHERAPI_API_KEY:-}
      KOR_TRAVEL_WEATHER_OPENWEATHERMAP_API_KEY: ${KOR_TRAVEL_WEATHER_OPENWEATHERMAP_API_KEY:-}
      KOR_TRAVEL_WEATHER_VISUAL_CROSSING_API_KEY: ${KOR_TRAVEL_WEATHER_VISUAL_CROSSING_API_KEY:-}
      KOR_TRAVEL_WEATHER_TOMORROW_IO_API_KEY: ${KOR_TRAVEL_WEATHER_TOMORROW_IO_API_KEY:-}
      KOR_TRAVEL_WEATHER_WEATHERBIT_API_KEY: ${KOR_TRAVEL_WEATHER_WEATHERBIT_API_KEY:-}
      KOR_TRAVEL_WEATHER_WEATHERSTACK_API_KEY: ${KOR_TRAVEL_WEATHER_WEATHERSTACK_API_KEY:-}
      KOR_TRAVEL_WEATHER_ACCUWEATHER_API_KEY: ${KOR_TRAVEL_WEATHER_ACCUWEATHER_API_KEY:-}
      KOR_TRAVEL_WEATHER_OPEN_METEO_BASE_URL: ${KOR_TRAVEL_WEATHER_OPEN_METEO_BASE_URL:-https://api.open-meteo.com/v1}
      KOR_TRAVEL_WEATHER_WTTR_IN_BASE_URL: ${KOR_TRAVEL_WEATHER_WTTR_IN_BASE_URL:-https://wttr.in}
      KOR_TRAVEL_WEATHER_VISUAL_CROSSING_BASE_URL: ${KOR_TRAVEL_WEATHER_VISUAL_CROSSING_BASE_URL:-https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services}
      KOR_TRAVEL_WEATHER_TARGETS: ${KOR_TRAVEL_WEATHER_TARGETS:-[]}
      KOR_TRAVEL_WEATHER_EXTRA_POINTS: ${KOR_TRAVEL_WEATHER_EXTRA_POINTS:-}
      KOR_TRAVEL_WEATHER_AIRKOREA_MAX_STATIONS: ${KOR_TRAVEL_WEATHER_AIRKOREA_MAX_STATIONS:-1000}
      KOR_TRAVEL_WEATHER_MAX_GRIDS_PER_RUN: ${KOR_TRAVEL_WEATHER_MAX_GRIDS_PER_RUN:-300}
      KOR_TRAVEL_WEATHER_MAX_TARGETS_PER_RUN: ${KOR_TRAVEL_WEATHER_MAX_TARGETS_PER_RUN:-10000}
      KOR_TRAVEL_WEATHER_MAX_RESPONSE_ROWS_PER_RUN: ${KOR_TRAVEL_WEATHER_MAX_RESPONSE_ROWS_PER_RUN:-1000000}
      KOR_TRAVEL_WEATHER_MAX_VALUES_PER_RUN: ${KOR_TRAVEL_WEATHER_MAX_VALUES_PER_RUN:-500000}
      KOR_TRAVEL_WEATHER_MAX_PAYLOAD_BYTES_PER_RUN: ${KOR_TRAVEL_WEATHER_MAX_PAYLOAD_BYTES_PER_RUN:-16777216}
    expose:
      - "14102"
    volumes:
      - dagster-home:/opt/dagster/home
    command: ["dagster", "dev", "-m", "kortravelweather_dagster.definitions", "-h", "0.0.0.0", "-p", "14102"]
    working_dir: /app

  dagster-gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dagster-gateway
    restart: unless-stopped
    depends_on:
      dagster:
        condition: service_started
    environment:
      DAGSTER_UI_USER: ${DAGSTER_UI_USER:-admin}
      DAGSTER_UI_PASSWORD: ${WEATHER_UI_PASSWORD:?set WEATHER_UI_PASSWORD in .env}
    ports:
      - "127.0.0.1:14102:14102"

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
      args:
        INSTALL_DAGSTER: "0"
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      KOR_TRAVEL_WEATHER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-weather}@db:5432/${POSTGRES_DB:-weather}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command: ["alembic", "upgrade", "head"]
    working_dir: /app

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      WEATHER_API_INTERNAL_URL: http://api:14101
      DAGSTER_UI_INTERNAL_URL: http://dagster:14102
      NEXT_PUBLIC_DAGSTER_URL: ${NEXT_PUBLIC_DAGSTER_URL:-https://weather-dagster.digitie.mywire.org}
      WEATHER_ADMIN_TOKEN: ${KOR_TRAVEL_WEATHER_ADMIN_TOKEN:?set KOR_TRAVEL_WEATHER_ADMIN_TOKEN in .env}
      WEATHER_UI_USER: ${WEATHER_UI_USER:-admin}
      WEATHER_UI_PASSWORD: ${WEATHER_UI_PASSWORD:?set WEATHER_UI_PASSWORD in .env}
      WEATHER_UI_SESSION_SECRET: ${WEATHER_UI_SESSION_SECRET:?set WEATHER_UI_SESSION_SECRET in .env}
      # Enable only when the front proxy strips and rewrites forwarding headers.
      WEATHER_UI_TRUST_PROXY: ${WEATHER_UI_TRUST_PROXY:-false}
      # CSRF accepts browser Origins only from this explicit public allowlist.
      # The default compose surface is loopback; production n150 deployments
      # override this with the public HTTPS origin in their secret env file.
      WEATHER_UI_PUBLIC_ORIGIN: ${WEATHER_UI_PUBLIC_ORIGIN:-http://127.0.0.1:14105}
    ports:
      - "127.0.0.1:14105:14105"

volumes:
  weather-postgres:
  dagster-home:
