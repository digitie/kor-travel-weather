# Shared by every dagster-* service below (grpc_server workspace targets and
# the daemon never import kortravelweather_dagster.definitions directly any
# more, but keeping one environment block avoids each service silently
# drifting from what the others receive -- see deploy/n150.md for why the
# three were split out of one `dagster dev` process in the first place).
x-dagster-environment: &dagster-environment
  DAGSTER_HOME: /opt/dagster/home
  KOR_TRAVEL_WEATHER_ENV: production
  KOR_TRAVEL_WEATHER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-weather}@db:5432/${POSTGRES_DB:-weather}
  # kor-travel-shared-postgres (loopback :11000 on the host -- see
  # kor-travel-docker-manager's ADR-44, which set this instance up for
  # concierge first), not weather's own `db`. Deliberately not migrating the
  # old weather_dagster run/schedule/event-log history there: this points at
  # a freshly created, empty database and accumulates new data from here on
  # (the old database is left in place on `db` as a rollback fallback, same
  # as ADR-44 kept concierge's old instance running rather than dropping it).
  # The password is embedded in the URL, unlike
  # KOR_TRAVEL_WEATHER_DATABASE_URL's PGPASSWORD convention above, because
  # deploy/dagster.yaml's run/event-log/schedule storage config reads
  # postgres_url as one opaque environment variable with no separate
  # password field to source from PGPASSWORD. host.docker.internal resolves
  # via the extra_hosts entry below -- the shared instance is host-networked
  # loopback-only, unreachable by weather's own bridge-networked services'
  # service-name DNS.
  DAGSTER_POSTGRES_URL: postgresql://kor_travel_weather_dagster_app:${KOR_TRAVEL_WEATHER_DAGSTER_SHARED_PG_PASSWORD:?set KOR_TRAVEL_WEATHER_DAGSTER_SHARED_PG_PASSWORD in .env}@host.docker.internal:11000/kor_travel_weather_dagster
  PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  KOR_TRAVEL_WEATHER_ADMIN_TOKEN: ${KOR_TRAVEL_WEATHER_ADMIN_TOKEN:?set KOR_TRAVEL_WEATHER_ADMIN_TOKEN in .env}
  KOR_TRAVEL_WEATHER_CREDENTIAL_ENCRYPTION_KEY: ${KOR_TRAVEL_WEATHER_CREDENTIAL_ENCRYPTION_KEY:-}
  KOR_TRAVEL_WEATHER_DATA_GO_KR_SERVICE_KEY: ${KOR_TRAVEL_WEATHER_DATA_GO_KR_SERVICE_KEY:-}
  KOR_TRAVEL_WEATHER_AIRKOREA_API_KEY: ${KOR_TRAVEL_WEATHER_AIRKOREA_API_KEY:-${KOR_TRAVEL_WEATHER_DATA_GO_KR_SERVICE_KEY:-}}
  KOR_TRAVEL_WEATHER_KREX_API_KEY: ${KOR_TRAVEL_WEATHER_KREX_API_KEY:-}
  KOR_TRAVEL_WEATHER_KMA_ALERT_STATION_ID: ${KOR_TRAVEL_WEATHER_KMA_ALERT_STATION_ID:-108}
  KOR_TRAVEL_WEATHER_ENABLED_PROVIDERS: ${KOR_TRAVEL_WEATHER_ENABLED_PROVIDERS:-["python-kma-api","python-airkorea-api","open_meteo","weatherapi","openweathermap","tomorrow_io","weatherbit","weatherstack","accuweather"]}
  # 15s/1 retry (2 attempts total) was too thin for data.go.kr's gateway,
  # which has a documented SERVICETIMEOUT_ERROR mode -- KMA and AirKorea
  # both saw runs fail outright on a single slow response. 20s/3 retries
  # (4 attempts, backoff tail up to ~1.2s) rides out a brief stall instead.
  KOR_TRAVEL_WEATHER_PROVIDER_HTTP_TIMEOUT_SECONDS: ${KOR_TRAVEL_WEATHER_PROVIDER_HTTP_TIMEOUT_SECONDS:-20}
  KOR_TRAVEL_WEATHER_PROVIDER_RETRIES: ${KOR_TRAVEL_WEATHER_PROVIDER_RETRIES:-3}
  KOR_TRAVEL_WEATHER_WEATHERAPI_API_KEY: ${KOR_TRAVEL_WEATHER_WEATHERAPI_API_KEY:-}
  KOR_TRAVEL_WEATHER_OPENWEATHERMAP_API_KEY: ${KOR_TRAVEL_WEATHER_OPENWEATHERMAP_API_KEY:-}
  KOR_TRAVEL_WEATHER_VISUAL_CROSSING_API_KEY: ${KOR_TRAVEL_WEATHER_VISUAL_CROSSING_API_KEY:-}
  KOR_TRAVEL_WEATHER_TOMORROW_IO_API_KEY: ${KOR_TRAVEL_WEATHER_TOMORROW_IO_API_KEY:-}
  KOR_TRAVEL_WEATHER_WEATHERBIT_API_KEY: ${KOR_TRAVEL_WEATHER_WEATHERBIT_API_KEY:-}
  KOR_TRAVEL_WEATHER_WEATHERSTACK_API_KEY: ${KOR_TRAVEL_WEATHER_WEATHERSTACK_API_KEY:-}
  KOR_TRAVEL_WEATHER_ACCUWEATHER_API_KEY: ${KOR_TRAVEL_WEATHER_ACCUWEATHER_API_KEY:-}
  KOR_TRAVEL_WEATHER_OPEN_METEO_BASE_URL: ${KOR_TRAVEL_WEATHER_OPEN_METEO_BASE_URL:-https://api.open-meteo.com/v1}
  KOR_TRAVEL_WEATHER_WTTR_IN_BASE_URL: ${KOR_TRAVEL_WEATHER_WTTR_IN_BASE_URL:-https://wttr.in}
  KOR_TRAVEL_WEATHER_VISUAL_CROSSING_BASE_URL: ${KOR_TRAVEL_WEATHER_VISUAL_CROSSING_BASE_URL:-https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services}
  KOR_TRAVEL_WEATHER_TARGETS: ${KOR_TRAVEL_WEATHER_TARGETS:-[]}
  KOR_TRAVEL_WEATHER_EXTRA_POINTS: ${KOR_TRAVEL_WEATHER_EXTRA_POINTS:-}
  KOR_TRAVEL_WEATHER_AIRKOREA_MAX_STATIONS: ${KOR_TRAVEL_WEATHER_AIRKOREA_MAX_STATIONS:-1000}
  KOR_TRAVEL_WEATHER_MAX_GRIDS_PER_RUN: ${KOR_TRAVEL_WEATHER_MAX_GRIDS_PER_RUN:-300}
  KOR_TRAVEL_WEATHER_MAX_TARGETS_PER_RUN: ${KOR_TRAVEL_WEATHER_MAX_TARGETS_PER_RUN:-10000}
  # How much of the catalog each external provider sweeps, and how fast it
  # may ask. Both default from each vendor's free-tier quota; the code
  # comments in settings.py carry the arithmetic. Override only against a
  # paid plan -- exceeding a quota throttles the provider into runs that
  # outlive their own schedule.
  KOR_TRAVEL_WEATHER_PROVIDER_LOCATION_CAPS: ${KOR_TRAVEL_WEATHER_PROVIDER_LOCATION_CAPS:-{"weatherapi":150,"open_meteo":380,"openweathermap":350}}
  KOR_TRAVEL_WEATHER_PROVIDER_MIN_REQUEST_INTERVAL_SECONDS: ${KOR_TRAVEL_WEATHER_PROVIDER_MIN_REQUEST_INTERVAL_SECONDS:-{"openweathermap":1.25}}
  KOR_TRAVEL_WEATHER_MAX_RESPONSE_ROWS_PER_RUN: ${KOR_TRAVEL_WEATHER_MAX_RESPONSE_ROWS_PER_RUN:-1000000}
  # 500k was sized before external forecast/timeline datasets were added.
  # Those legitimately fetch a multi-day hourly window per location --
  # open_meteo_forecast alone needs ~1.9M for the current catalog size
  # (1,428 locations x 7 days x 24h x 8 fields), so every run of it failed
  # outright, discarding a fully-fetched batch. 8M covers today's largest
  # legitimate run (visual_crossing_timeline's ~15-day hourly window) with
  # headroom for catalog growth, while still catching a genuine runaway.
  KOR_TRAVEL_WEATHER_MAX_VALUES_PER_RUN: ${KOR_TRAVEL_WEATHER_MAX_VALUES_PER_RUN:-8000000}
  KOR_TRAVEL_WEATHER_MAX_PAYLOAD_BYTES_PER_RUN: ${KOR_TRAVEL_WEATHER_MAX_PAYLOAD_BYTES_PER_RUN:-16777216}
  # Never actually reached this container until now: settings.py has
  # defaulted retention_days to 2 all along, but nothing here forwarded
  # KOR_TRAVEL_WEATHER_RETENTION_DAYS from the deployment .env, so every
  # deployment ran on the code default regardless of what was configured.
  KOR_TRAVEL_WEATHER_RETENTION_DAYS: ${KOR_TRAVEL_WEATHER_RETENTION_DAYS:-2}
  KOR_TRAVEL_WEATHER_RETENTION_AHEAD_DAYS: ${KOR_TRAVEL_WEATHER_RETENTION_AHEAD_DAYS:-7}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Marker/resolve queries use PostgreSQL window functions.  The Docker
    # default /dev/shm is only 64 MiB and can make parallel plans fail with
    # ``could not resize shared memory segment`` under concurrent scrapes.
    # Keep the limit explicit so production behaviour is not host-dependent.
    shm_size: 1gb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weather}
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Bind service ports to loopback; expose them through an authenticated
    # gateway/SSH tunnel rather than publishing the database directly.
    ports:
      - "127.0.0.1:14100:5432"
    volumes:
      - weather-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
      args:
        INSTALL_DAGSTER: "0"
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Compose is the supported PostgreSQL deployment surface.  Local runs
      # should use the PostgreSQL service (or another PostgreSQL DSN).
      KOR_TRAVEL_WEATHER_ENV: production
      # Pass the password through libpq rather than interpolating it in a URL;
      # punctuation such as @ and : therefore remains safe.
      KOR_TRAVEL_WEATHER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-weather}@db:5432/${POSTGRES_DB:-weather}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      KOR_TRAVEL_WEATHER_ADMIN_TOKEN: ${KOR_TRAVEL_WEATHER_ADMIN_TOKEN:?set KOR_TRAVEL_WEATHER_ADMIN_TOKEN in .env}
      KOR_TRAVEL_WEATHER_METRICS_TOKEN: ${KOR_TRAVEL_WEATHER_METRICS_TOKEN:?set KOR_TRAVEL_WEATHER_METRICS_TOKEN in .env}
      KOR_TRAVEL_WEATHER_CREDENTIAL_ENCRYPTION_KEY: ${KOR_TRAVEL_WEATHER_CREDENTIAL_ENCRYPTION_KEY:-}
      KOR_TRAVEL_WEATHER_CORS_ORIGINS: '${KOR_TRAVEL_WEATHER_CORS_ORIGINS:-["https://weather.digitie.mywire.org","http://127.0.0.1:14105"]}'
      KOR_TRAVEL_WEATHER_API_BASE_URL: ${KOR_TRAVEL_WEATHER_API_BASE_URL:-https://weather-api.digitie.mywire.org}
      KOR_TRAVEL_WEATHER_DATA_GO_KR_SERVICE_KEY: ${KOR_TRAVEL_WEATHER_DATA_GO_KR_SERVICE_KEY:-}
      KOR_TRAVEL_WEATHER_AIRKOREA_API_KEY: ${KOR_TRAVEL_WEATHER_AIRKOREA_API_KEY:-${KOR_TRAVEL_WEATHER_DATA_GO_KR_SERVICE_KEY:-}}
      KOR_TRAVEL_WEATHER_KREX_API_KEY: ${KOR_TRAVEL_WEATHER_KREX_API_KEY:-}
      KOR_TRAVEL_WEATHER_KMA_ALERT_STATION_ID: ${KOR_TRAVEL_WEATHER_KMA_ALERT_STATION_ID:-108}
      KOR_TRAVEL_WEATHER_ENABLED_PROVIDERS: ${KOR_TRAVEL_WEATHER_ENABLED_PROVIDERS:-["python-kma-api","python-airkorea-api","open_meteo","weatherapi","openweathermap","tomorrow_io","weatherbit","weatherstack","accuweather"]}
      KOR_TRAVEL_WEATHER_WEATHERAPI_API_KEY: ${KOR_TRAVEL_WEATHER_WEATHERAPI_API_KEY:-}
      KOR_TRAVEL_WEATHER_OPENWEATHERMAP_API_KEY: ${KOR_TRAVEL_WEATHER_OPENWEATHERMAP_API_KEY:-}
      KOR_TRAVEL_WEATHER_VISUAL_CROSSING_API_KEY: ${KOR_TRAVEL_WEATHER_VISUAL_CROSSING_API_KEY:-}
      KOR_TRAVEL_WEATHER_TOMORROW_IO_API_KEY: ${KOR_TRAVEL_WEATHER_TOMORROW_IO_API_KEY:-}
      KOR_TRAVEL_WEATHER_WEATHERBIT_API_KEY: ${KOR_TRAVEL_WEATHER_WEATHERBIT_API_KEY:-}
      KOR_TRAVEL_WEATHER_WEATHERSTACK_API_KEY: ${KOR_TRAVEL_WEATHER_WEATHERSTACK_API_KEY:-}
      KOR_TRAVEL_WEATHER_ACCUWEATHER_API_KEY: ${KOR_TRAVEL_WEATHER_ACCUWEATHER_API_KEY:-}
      KOR_TRAVEL_WEATHER_OPEN_METEO_BASE_URL: ${KOR_TRAVEL_WEATHER_OPEN_METEO_BASE_URL:-https://api.open-meteo.com/v1}
      KOR_TRAVEL_WEATHER_WTTR_IN_BASE_URL: ${KOR_TRAVEL_WEATHER_WTTR_IN_BASE_URL:-https://wttr.in}
      KOR_TRAVEL_WEATHER_VISUAL_CROSSING_BASE_URL: ${KOR_TRAVEL_WEATHER_VISUAL_CROSSING_BASE_URL:-https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services}
      KOR_TRAVEL_WEATHER_MAX_PAYLOAD_BYTES_PER_RUN: ${KOR_TRAVEL_WEATHER_MAX_PAYLOAD_BYTES_PER_RUN:-16777216}
    ports:
      - "127.0.0.1:14101:14101"
    command: ["uvicorn", "kortravelweather_api.app:app", "--host", "0.0.0.0", "--port", "14101"]
    working_dir: /app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:14101/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Runs the actual job code (kortravelweather_dagster.definitions) and every
  # run's forked subprocess -- the heaviest of the three, and the one that
  # inherits the full application environment below. It used to be one third
  # of a `dagster dev` process instead of its own container: that process
  # bundled this code-server as an internal child watched only by dagster
  # dev's own supervision, which could not tell "the process is alive but
  # wedged" from "the process is fine" and had no path back from the former
  # (see deploy/n150.md's incident writeup). A standalone `dagster api grpc`
  # here is never passed --heartbeat, so it has no self-destruct clock at
  # all; it now only stops for a real crash or OOM, which `restart:
  # unless-stopped` already handles the same way it does for every other
  # service in this file.
  dagster-code-server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
      args:
        INSTALL_DAGSTER: "1"
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *dagster-environment
      KOR_TRAVEL_WEATHER_METRICS_PORT: ${KOR_TRAVEL_WEATHER_METRICS_PORT:-14103}
      PROMETHEUS_MULTIPROC_DIR: /var/run/kor-travel-weather-metrics
      # 15s/1 retry (2 attempts total) was too thin for data.go.kr's gateway,
      # which has a documented SERVICETIMEOUT_ERROR mode -- KMA and AirKorea
      # both saw runs fail outright on a single slow response. 20s/3 retries
      # (4 attempts, backoff tail up to ~1.2s) rides out a brief stall instead.
      KOR_TRAVEL_WEATHER_PROVIDER_HTTP_TIMEOUT_SECONDS: ${KOR_TRAVEL_WEATHER_PROVIDER_HTTP_TIMEOUT_SECONDS:-20}
      KOR_TRAVEL_WEATHER_PROVIDER_RETRIES: ${KOR_TRAVEL_WEATHER_PROVIDER_RETRIES:-3}
      KOR_TRAVEL_WEATHER_WEATHERAPI_API_KEY: ${KOR_TRAVEL_WEATHER_WEATHERAPI_API_KEY:-}
      KOR_TRAVEL_WEATHER_OPENWEATHERMAP_API_KEY: ${KOR_TRAVEL_WEATHER_OPENWEATHERMAP_API_KEY:-}
      KOR_TRAVEL_WEATHER_VISUAL_CROSSING_API_KEY: ${KOR_TRAVEL_WEATHER_VISUAL_CROSSING_API_KEY:-}
      KOR_TRAVEL_WEATHER_TOMORROW_IO_API_KEY: ${KOR_TRAVEL_WEATHER_TOMORROW_IO_API_KEY:-}
      KOR_TRAVEL_WEATHER_WEATHERBIT_API_KEY: ${KOR_TRAVEL_WEATHER_WEATHERBIT_API_KEY:-}
      KOR_TRAVEL_WEATHER_WEATHERSTACK_API_KEY: ${KOR_TRAVEL_WEATHER_WEATHERSTACK_API_KEY:-}
      KOR_TRAVEL_WEATHER_ACCUWEATHER_API_KEY: ${KOR_TRAVEL_WEATHER_ACCUWEATHER_API_KEY:-}
      KOR_TRAVEL_WEATHER_OPEN_METEO_BASE_URL: ${KOR_TRAVEL_WEATHER_OPEN_METEO_BASE_URL:-https://api.open-meteo.com/v1}
      KOR_TRAVEL_WEATHER_WTTR_IN_BASE_URL: ${KOR_TRAVEL_WEATHER_WTTR_IN_BASE_URL:-https://wttr.in}
      KOR_TRAVEL_WEATHER_VISUAL_CROSSING_BASE_URL: ${KOR_TRAVEL_WEATHER_VISUAL_CROSSING_BASE_URL:-https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services}
      KOR_TRAVEL_WEATHER_TARGETS: ${KOR_TRAVEL_WEATHER_TARGETS:-[]}
      KOR_TRAVEL_WEATHER_EXTRA_POINTS: ${KOR_TRAVEL_WEATHER_EXTRA_POINTS:-}
      KOR_TRAVEL_WEATHER_AIRKOREA_MAX_STATIONS: ${KOR_TRAVEL_WEATHER_AIRKOREA_MAX_STATIONS:-1000}
      KOR_TRAVEL_WEATHER_MAX_GRIDS_PER_RUN: ${KOR_TRAVEL_WEATHER_MAX_GRIDS_PER_RUN:-300}
      KOR_TRAVEL_WEATHER_MAX_TARGETS_PER_RUN: ${KOR_TRAVEL_WEATHER_MAX_TARGETS_PER_RUN:-10000}
      # How much of the catalog each external provider sweeps, and how fast it
      # may ask. Both default from each vendor's free-tier quota; the code
      # comments in settings.py carry the arithmetic. Override only against a
      # paid plan -- exceeding a quota throttles the provider into runs that
      # outlive their own schedule.
      KOR_TRAVEL_WEATHER_PROVIDER_LOCATION_CAPS: ${KOR_TRAVEL_WEATHER_PROVIDER_LOCATION_CAPS:-{"weatherapi":150,"open_meteo":380,"openweathermap":350}}
      KOR_TRAVEL_WEATHER_PROVIDER_MIN_REQUEST_INTERVAL_SECONDS: ${KOR_TRAVEL_WEATHER_PROVIDER_MIN_REQUEST_INTERVAL_SECONDS:-{"openweathermap":1.25}}
      KOR_TRAVEL_WEATHER_MAX_RESPONSE_ROWS_PER_RUN: ${KOR_TRAVEL_WEATHER_MAX_RESPONSE_ROWS_PER_RUN:-1000000}
      # 500k was sized before external forecast/timeline datasets were added.
      # Those legitimately fetch a multi-day hourly window per location --
      # open_meteo_forecast alone needs ~1.9M for the current catalog size
      # (1,428 locations x 7 days x 24h x 8 fields), so every run of it failed
      # outright, discarding a fully-fetched batch. 8M covers today's largest
      # legitimate run (visual_crossing_timeline's ~15-day hourly window) with
      # headroom for catalog growth, while still catching a genuine runaway.
      KOR_TRAVEL_WEATHER_MAX_VALUES_PER_RUN: ${KOR_TRAVEL_WEATHER_MAX_VALUES_PER_RUN:-8000000}
      KOR_TRAVEL_WEATHER_MAX_PAYLOAD_BYTES_PER_RUN: ${KOR_TRAVEL_WEATHER_MAX_PAYLOAD_BYTES_PER_RUN:-16777216}
      # settings.py has defaulted retention_days to 2 all along; this is what
      # actually forwards KOR_TRAVEL_WEATHER_RETENTION_DAYS from the
      # deployment .env into the container that runs the retention job.
      KOR_TRAVEL_WEATHER_RETENTION_DAYS: ${KOR_TRAVEL_WEATHER_RETENTION_DAYS:-2}
      KOR_TRAVEL_WEATHER_RETENTION_AHEAD_DAYS: ${KOR_TRAVEL_WEATHER_RETENTION_AHEAD_DAYS:-7}
    expose:
      - "14106"
      - "14103"
    # Loopback-only, not the LAN address `dagster-gateway`/`api`/`web` use in
    # deploy/compose.n150.yaml: this gRPC port has none of dagster-gateway's
    # Basic Auth in front of it (nothing does -- it's a bare code-server, and
    # a peer that reaches it can execute code and launch runs directly), so
    # only the host itself should be able to reach it -- which is exactly
    # what a host-networked shared dagster-webserver/dagster-daemon
    # (following kor-travel-docker-manager's platform-topology.md §7 plan,
    # matching pinvi/geo's own host-network + loopback code-server wiring)
    # would need in order to register this location in its workspace.yaml.
    # Not reachable from other machines on the LAN.
    ports:
      - "127.0.0.1:14106:14106"
    volumes:
      - dagster-home:/opt/dagster/home
      # Read-only: this is configuration, and the instance writes its run
      # storage alongside it in the volume above.  Without it Dagster runs on
      # defaults that leave a run STARTED for ever when its process dies, and
      # those runs keep consuming the concurrency limit.
      - ./deploy/dagster.yaml:/opt/dagster/home/dagster.yaml:ro
    tmpfs:
      - /var/run/kor-travel-weather-metrics
    command:
      [
        "dagster",
        "api",
        "grpc",
        "-h",
        "0.0.0.0",
        "-p",
        "14106",
        "-m",
        "kortravelweather_dagster.definitions",
        "--inject-env-vars-from-instance",
      ]
    working_dir: /app
    # kor-travel-shared-postgres (DAGSTER_POSTGRES_URL above) is
    # host-networked and loopback-only; this is what lets a bridge-networked
    # container reach the host's own loopback via `host.docker.internal`,
    # since `--inject-env-vars-from-instance` needs the code server to reach
    # the instance's storage directly, the same as the webserver/daemon do.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Relative CPU priority under contention (work-conserving: costs nothing
    # while idle, only outranks default-priority (1024) siblings when they are
    # actually competing for the same core) and memory headroom/OOM
    # preference -- this is the container a host-wide CPU/memory squeeze from
    # unrelated projects sharing n150 actually hit (see deploy/n150.md).
    # `cpus:` (a hard CFS quota) is deliberately not set here: it would
    # protect *other* containers from this one, not the other way around, and
    # would throttle -- i.e. self-inflict new latency on -- exactly the
    # process this is trying to make more responsive.
    cpu_shares: 4096
    mem_reservation: 2g
    mem_limit: 4g
    mem_swappiness: 10
    oom_score_adj: -500
    pids_limit: 2048
    healthcheck:
      test: ["CMD", "dagster", "api", "grpc-health-check", "-h", "127.0.0.1", "-p", "14106"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Serves the UI/GraphQL API only -- never imports user code, so it cannot be
  # the thing that goes down when a run or the code server misbehaves.
  dagster-webserver:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
      args:
        INSTALL_DAGSTER: "1"
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      dagster-code-server:
        condition: service_healthy
    environment:
      <<: *dagster-environment
    expose:
      - "14102"
    volumes:
      - dagster-home:/opt/dagster/home
      - ./deploy/dagster.yaml:/opt/dagster/home/dagster.yaml:ro
      - ./deploy/workspace.yaml:/app/deploy/workspace.yaml:ro
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "14102", "-w", "/app/deploy/workspace.yaml"]
    working_dir: /app
    # kor-travel-shared-postgres (DAGSTER_POSTGRES_URL above) is
    # host-networked and loopback-only; this is what lets this
    # bridge-networked container reach the host's own loopback.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cpu_shares: 2048
    mem_reservation: 512m
    mem_swappiness: 10
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:14102/server_info', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # Schedules/sensors/run queueing/run monitoring only -- also never imports
  # user code. Exactly one instance system-wide, per Dagster's own guidance.
  dagster-daemon:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
      args:
        INSTALL_DAGSTER: "1"
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      dagster-code-server:
        condition: service_healthy
    environment:
      <<: *dagster-environment
    volumes:
      - dagster-home:/opt/dagster/home
      - ./deploy/dagster.yaml:/opt/dagster/home/dagster.yaml:ro
      - ./deploy/workspace.yaml:/app/deploy/workspace.yaml:ro
    command: ["dagster-daemon", "run", "-w", "/app/deploy/workspace.yaml"]
    working_dir: /app
    # kor-travel-shared-postgres (DAGSTER_POSTGRES_URL above) is
    # host-networked and loopback-only; this is what lets this
    # bridge-networked container reach the host's own loopback.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cpu_shares: 2048
    mem_reservation: 512m
    mem_swappiness: 10
    healthcheck:
      test: ["CMD", "dagster-daemon", "liveness-check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  dagster-gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dagster-gateway
    restart: unless-stopped
    depends_on:
      dagster-webserver:
        condition: service_started
    environment:
      DAGSTER_UI_USER: ${DAGSTER_UI_USER:-admin}
      DAGSTER_UI_PASSWORD: ${WEATHER_UI_PASSWORD:?set WEATHER_UI_PASSWORD in .env}
    ports:
      - "127.0.0.1:14102:14102"

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
      args:
        INSTALL_DAGSTER: "0"
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      KOR_TRAVEL_WEATHER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-weather}@db:5432/${POSTGRES_DB:-weather}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command: ["alembic", "upgrade", "head"]
    working_dir: /app

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      dagster-code-server:
        condition: service_started
    secrets:
      - source: metrics_token
        target: metrics.token
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:14104:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_VWORLD_API_KEY: ${NEXT_PUBLIC_VWORLD_API_KEY:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      WEATHER_API_INTERNAL_URL: http://api:14101
      DAGSTER_UI_INTERNAL_URL: http://dagster-webserver:14102
      NEXT_PUBLIC_DAGSTER_URL: ${NEXT_PUBLIC_DAGSTER_URL:-https://weather-dagster.digitie.mywire.org}
      # The VWorld browser key is public and is embedded at Next build time.
      NEXT_PUBLIC_VWORLD_API_KEY: ${NEXT_PUBLIC_VWORLD_API_KEY:-}
      WEATHER_ADMIN_TOKEN: ${KOR_TRAVEL_WEATHER_ADMIN_TOKEN:?set KOR_TRAVEL_WEATHER_ADMIN_TOKEN in .env}
      WEATHER_UI_USER: ${WEATHER_UI_USER:-admin}
      WEATHER_UI_PASSWORD: ${WEATHER_UI_PASSWORD:?set WEATHER_UI_PASSWORD in .env}
      # Optional Geo-compatible PBKDF2 password hash. When set, the login
      # route verifies this hash instead of WEATHER_UI_PASSWORD. The web UI is
      # session-only; Basic Auth is reserved for the Dagster gateway.
      WEATHER_UI_PASSWORD_HASH: ${WEATHER_UI_PASSWORD_HASH:-}
      WEATHER_UI_SESSION_SECRET: ${WEATHER_UI_SESSION_SECRET:?set WEATHER_UI_SESSION_SECRET in .env}
      # Enable only when the front proxy strips and rewrites forwarding headers.
      WEATHER_UI_TRUST_PROXY: ${WEATHER_UI_TRUST_PROXY:-false}
      # CSRF accepts browser Origins only from this explicit public allowlist.
      # The default compose surface is loopback; production n150 deployments
      # override this with the public HTTPS origin in their secret env file.
      WEATHER_UI_PUBLIC_ORIGIN: ${WEATHER_UI_PUBLIC_ORIGIN:-http://127.0.0.1:14105}
    ports:
      - "127.0.0.1:14105:14105"

volumes:
  weather-postgres:
  dagster-home:
  prometheus-data:

secrets:
  metrics_token:
    environment: KOR_TRAVEL_WEATHER_METRICS_TOKEN
