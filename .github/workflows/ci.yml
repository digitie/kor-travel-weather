name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      KOR_TRAVEL_WEATHER_ENV: development
      KOR_TRAVEL_WEATHER_DATABASE_URL: postgresql+psycopg://weather:weather@127.0.0.1:5432/weather_test
      KOR_TRAVEL_WEATHER_TEST_DATABASE_URL: postgresql+psycopg://weather:weather@127.0.0.1:5432/weather_test
      PGPASSWORD: weather
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: weather
          POSTGRES_PASSWORD: weather
          POSTGRES_DB: weather_test
        options: >-
          --health-cmd "pg_isready -U weather -d weather_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev --extra dagster
      - name: Migrate PostgreSQL test database
        run: uv run --locked alembic upgrade head
      - name: Test
        run: TMPDIR=/tmp uv run --locked --extra dev --extra dagster pytest -q
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check OpenAPI is exported
        run: |
          export KOR_TRAVEL_WEATHER_ENV=development
          PYTHONPATH=src:packages/kor-travel-weather-api/src \
            uv run --locked python packages/kor-travel-weather-api/scripts/export_openapi.py
          git diff --exit-code -- packages/kor-travel-weather-api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kor-travel-weather-admin/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/kor-travel-weather-admin/frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
