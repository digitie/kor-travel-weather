name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  common-policy:
    uses: digitie/kor-travel-common/.github/workflows/frontend-consumer-guard.yml@d644632ea9eaf2f6b6baa49305d65fae5bbc0bd4
    with:
      common-ref: d644632ea9eaf2f6b6baa49305d65fae5bbc0bd4
      frontends: >-
        [{"package":"packages/kor-travel-weather-admin/frontend/package.json","lock":"packages/kor-travel-weather-admin/frontend/package-lock.json","workspace":"","profile":"web"}]
      toolchain-manifests: '[]'
      node-dockerfiles: >-
        ["deploy/Dockerfile.web"]

  backend-dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: consumer
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: digitie/kor-travel-common
          ref: 8a0ec23c206648ae5d81f365748f66d5ca6047f1
          path: common-policy
          persist-credentials: false
      - name: Check used shared backend source and lock
        run: |
          test "$(git -C common-policy rev-parse HEAD)" = 8a0ec23c206648ae5d81f365748f66d5ca6047f1
          python3 -B common-policy/tools/check_versions.py "$GITHUB_WORKSPACE/consumer" \
            --registry "$GITHUB_WORKSPACE/common-policy/versions.json" \
            --repo kor-travel-weather --strict-python-application \
            --json "$RUNNER_TEMP/weather-backend-policy.json" --no-step-summary

  python:
    runs-on: ubuntu-latest
    env:
      KOR_TRAVEL_WEATHER_ENV: development
      KOR_TRAVEL_WEATHER_DATABASE_URL: postgresql+psycopg://weather:weather@127.0.0.1:5432/weather_test
      KOR_TRAVEL_WEATHER_TEST_DATABASE_URL: postgresql+psycopg://weather:weather@127.0.0.1:5432/weather_test
      PGPASSWORD: weather
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: weather
          POSTGRES_PASSWORD: weather
          POSTGRES_DB: weather_test
        options: >-
          --health-cmd "pg_isready -U weather -d weather_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev --extra dagster
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check Prometheus configuration
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            -v /dev/null:/run/secrets/metrics.token:ro \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            check rules /etc/prometheus/alerts.yml
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            -v "$PWD/tests/prometheus:/tests:ro" \
            prom/prometheus:v3.5.0 \
            test rules /tests/alerts_test.yml
      - name: Migrate PostgreSQL test database
        run: uv run --locked alembic upgrade head
      - name: Check OpenAPI is exported
        run: |
          export KOR_TRAVEL_WEATHER_ENV=development
          PYTHONPATH=src:packages/kor-travel-weather-api/src \
            uv run --locked python packages/kor-travel-weather-api/scripts/export_openapi.py
          git diff --exit-code -- packages/kor-travel-weather-api/openapi.json
      - name: Test
        run: TMPDIR=/tmp uv run --locked --extra dev --extra dagster pytest -q

  frontend:
    needs: common-policy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kor-travel-weather-admin/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: packages/kor-travel-weather-admin/frontend/package-lock.json
      - run: |
          npm install --global npm@12.0.1
          node --version
          npm --version
          npm ci --engine-strict --ignore-scripts --no-audit --no-fund
      - run: npm run check:dependencies
      - run: npm run lint
      - run: npm run doctor
      - run: npm run type-check
      # `vitest run`, not watch mode: the script exits with the suite's result.
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:fixtures
      - run: npm run test:e2e:tiles
